name: 自动同步并发布 Windows 中文版
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      force_release:
        description: '即使上游未变化，也发布本次已验收的产品修复'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: windows-stable-release
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
      candidate: ${{ steps.sync.outputs.candidate }}
      upstream: ${{ steps.sync.outputs.upstream }}
      base: ${{ steps.sync.outputs.base }}
      branch: ${{ steps.sync.outputs.branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}
      - name: 生成上游同步候选
        id: sync
        env:
          FORCE_RELEASE: ${{ inputs.force_release || false }}
        run: python scripts/windows/sync.py
  build:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.sync.outputs.candidate }}
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: 8.0.425
      - name: 全量验收并生成安装包与更新包
        shell: pwsh
        run: ./scripts/windows/build.ps1 -Version '0.1.${{ github.run_number }}' -Output windows/artifacts/release -Package
      - name: 生成签名更新元数据
        shell: pwsh
        env:
          WINDOWS_UPDATE_PRIVATE_KEY: ${{ secrets.WINDOWS_UPDATE_PRIVATE_KEY }}
          PRODUCT_SHA: ${{ needs.sync.outputs.candidate }}
          UPSTREAM_SHA: ${{ needs.sync.outputs.upstream }}
        run: ./scripts/windows/sign-release.ps1 -ReleaseDirectory windows/artifacts/release/release -Version '0.1.${{ github.run_number }}' -ProductCommit $env:PRODUCT_SHA -UpstreamCommit $env:UPSTREAM_SHA
      - name: 实际安装并升级到候选版本
        shell: pwsh
        run: |
          ./scripts/windows/build.ps1 -Version 0.0.0 -Output windows/artifacts/baseline -Package -Shortcuts None
          ./scripts/windows/verify-upgrade.ps1 -Installer windows/artifacts/baseline/release/CompositorWindows-win-Setup.exe -InitialVersion 0.0.0 -TargetVersion '0.1.${{ github.run_number }}' -SignedFeedDirectory windows/artifacts/release/release -ReportDirectory windows/artifacts/upgrade
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-release
          path: windows/artifacts/release/release
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-release-ui
          path: windows/artifacts/release/ui
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-install-upgrade
          path: windows/artifacts/upgrade
  publish:
    needs: [sync, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.sync.outputs.candidate }}
          fetch-depth: 0
      - name: 下载已验收的发布产物
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --name windows-release --dir release
      - name: 发布完整资产并推进签名更新入口
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ needs.sync.outputs.candidate }}
          BASE_SHA: ${{ needs.sync.outputs.base }}
          PRODUCT_BRANCH: ${{ github.event.repository.default_branch }}
          PRODUCT_VERSION: 0.1.${{ github.run_number }}
        run: python scripts/windows/publish.py
  cleanup:
    needs: [sync, build, publish]
    if: always() && needs.sync.outputs.branch != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 清理此运行创建的临时候选分支
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_BRANCH: ${{ needs.sync.outputs.branch }}
        run: gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$CANDIDATE_BRANCH"
